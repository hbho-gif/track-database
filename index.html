<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>循人中学田径队数据库</title>
    <!-- 引入 PapaParse 用于解析 Google Sheet CSV 数据 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f6f9;
            color: #333;
        }
        .container {
            max-width: 960px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        /* 查询控制区 */
        .search-box {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            background: #eef2f7;
            padding: 16px;
            border-radius: 8px;
        }
        .search-box input {
            flex: 1;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }
        .search-box input:focus { border-color: #0056b3; }
        .search-box button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-search { background-color: #1a73e8; color: white; }
        .btn-search:hover { background-color: #1557b0; }
        .btn-print { background-color: #34a853; color: white; }
        .btn-print:hover { background-color: #2d8e47; }

        /* 个人基本资料卡片 */
        .profile-card {
            display: flex;
            gap: 24px;
            border-bottom: 2px solid #eef2f7;
            padding-bottom: 24px;
            margin-bottom: 24px;
        }
        .avatar {
            width: 150px;
            height: 190px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
            background-color: #fafafa;
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px 20px;
            flex: 1;
        }
        .info-item { font-size: 15px; line-height: 1.5; }
        .info-item label { font-weight: bold; color: #555; }
        .full-width { grid-column: span 2; }

        /* 页签 (Tabs) 切换控制 (屏幕看时可用，打印时自动展平) */
        .tabs {
            display: flex;
            gap: 8px;
            border-bottom: 2px solid #eef2f7;
            margin-top: 20px;
            margin-bottom: 15px;
        }
        .tab-btn {
            padding: 10px 16px;
            border: none;
            background: none;
            font-size: 15px;
            font-weight: bold;
            color: #666;
            cursor: pointer;
            border-bottom: 3px solid transparent;
        }
        .tab-btn.active {
            color: #1a73e8;
            border-bottom-color: #1a73e8;
        }

        /* 数据表格组件 */
        section { margin-top: 15px; }
        h3 { color: #1a73e8; border-left: 4px solid #1a73e8; padding-left: 10px; margin-bottom: 12px; margin-top: 0; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #e0e0e0;
            padding: 10px 12px;
            text-align: left;
        }
        th { background-color: #f8f9fa; font-weight: bold; color: #444; }
        tr:nth-child(even) { background-color: #fcfcfc; }

        .hidden { display: none !important; }
        .message { font-size: 16px; color: #666; text-align: center; padding: 50px 0; }

        /* A4 打印适配样式 */
        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; padding: 0; width: 100%; max-width: 100%; }
            .no-print { display: none !important; }
            .tab-content { display: block !important; margin-bottom: 25px; }
            h3 { border-left-color: #000; color: #000; }
            th { background-color: #eeeeee !important; -webkit-print-color-adjust: exact; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2 class="no-print" style="text-align: center; margin-top: 0; color: #1a73e8;">🏃‍♂️ 循人中学田径队数据库</h2>

    <!-- 查询与操作区 -->
    <div class="search-box no-print">
        <input type="text" id="studentIdInput" placeholder="请输入运动员学号 ID (如: 24001)">
        <button class="btn-search" onclick="searchStudent()">🔍 查询档案</button>
        <button class="btn-print" onclick="window.print()">🖨️ 打印/保存为 PDF</button>
    </div>

    <div id="loading" class="message hidden">⏳ 正在从云端调取档案，请稍候...</div>
    <div id="emptyMessage" class="message">💡 请在上方输入框输入学号 ID 并点击“查询档案”。</div>

    <!-- 档案主体 -->
    <div id="profileContent" class="hidden">
        
        <!-- 1. 个人基本资料 -->
        <div class="profile-card">
            <img id="avatarImg" class="avatar" src="" alt="运动员照片" onerror="this.src='https://dummyimage.com/150x190/cccccc/666666.png&text=No+Photo'">
            <div class="info-grid">
                <div class="info-item"><label>姓名 (中文)：</label><span id="infoNameC">-</span></div>
                <div class="info-item"><label>姓名 (英文)：</label><span id="infoNameE">-</span></div>
                <div class="info-item"><label>学号 ID：</label><span id="infoId">-</span></div>
                <div class="info-item"><label>性别：</label><span id="infoGender">-</span></div>
                <div class="info-item"><label>身份证 IC：</label><span id="infoIc">-</span></div>
                <div class="info-item"><label>出生日期：</label><span id="infoDob">-</span></div>
                <div class="info-item"><label>年龄 / 训练年龄：</label><span id="infoAgeGroup">-</span></div>
                <div class="info-item"><label>联络电话：</label><span id="infoContact">-</span></div>
                <div class="info-item full-width"><label>主项及最佳成绩：</label><span id="infoPrimary">-</span></div>
                <div class="info-item full-width"><label>副项及最佳成绩：</label><span id="infoSecondary">-</span></div>
                <div class="info-item full-width"><label>邮箱：</label><span id="infoEmail">-</span></div>
            </div>
        </div>

        <!-- 屏幕查看时的分类 Tabs 控制栏 -->
        <div class="tabs no-print">
            <button class="tab-btn active" onclick="switchTab('track')">🏃 比赛成绩 (TRACK)</button>
            <button class="tab-btn" onclick="switchTab('field')">🏋️ 比赛成绩 (FIELD)</button>
            <button class="tab-btn" onclick="switchTab('cross')">🌲 比赛成绩 (CROSS COUNTRY)</button>
            <button class="tab-btn" onclick="switchTab('tests')">📈 测试数据</button>
            <button class="tab-btn" onclick="switchTab('body')">📏 身体数据</button>
        </div>

        <!-- 2. 径赛成绩 TRACK -->
        <div id="tab-track" class="tab-content">
            <section>
                <h3>🏃 比赛成绩 (TRACK)</h3>
                <table id="trackTable">
                    <thead>
                        <tr><th>年份</th><th>比赛名称</th><th>比赛项目</th><th>比赛成绩 (hh:mm:ss,ss)</th><th>备注</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </section>
        </div>

        <!-- 3. 田赛成绩 FIELD -->
        <div id="tab-field" class="tab-content hidden">
            <section>
                <h3>🏋️ 比赛成绩 (FIELD)</h3>
                <table id="fieldTable">
                    <thead>
                        <tr><th>年份</th><th>比赛名称</th><th>比赛项目</th><th>比赛成绩 (m)</th><th>备注</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </section>
        </div>

        <!-- 4. 越野赛成绩 CROSS COUNTRY -->
        <div id="tab-cross" class="tab-content hidden">
            <section>
                <h3>🌲 比赛成绩 (CROSS COUNTRY)</h3>
                <table id="crossTable">
                    <thead>
                        <tr><th>年份</th><th>比赛名称</th><th>比赛项目</th><th>比赛成绩 (hh:mm:ss,ss)</th><th>备注</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </section>
        </div>

        <!-- 5. 测试数据 -->
        <div id="tab-tests" class="tab-content hidden">
            <section>
                <h3>📈 测试数据</h3>
                <table id="testsTable">
                    <thead>
                        <!-- 此处的表头会在加载数据时根据 Sheet 动态生成 -->
                    </thead>
                    <tbody></tbody>
                </table>
            </section>
        </div>

        <!-- 6. 身体数据 -->
        <div id="tab-body" class="tab-content hidden">
            <section>
                <h3>📏 身体数据</h3>
                <table id="bodyTable">
                    <thead>
                        <!-- 此处的表头会在加载数据时根据 Sheet 动态生成 -->
                    </thead>
                    <tbody></tbody>
                </table>
            </section>
        </div>

    </div>
</div>

<script>
    // ⚠️ 请在此处替换为您 Google Sheet 的真实 ID
    const SHEET_ID = "15iHPj4lwny0eiHs0EXndDeKA3oJgdvnO10aVkWPxukk";

    // 格式化获取 CSV 的 API
    const getSheetUrl = (sheetName) => 
        `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;

    // 读取 CSV 数据逻辑
    function fetchSheetData(sheetName) {
        return new Promise((resolve) => {
            Papa.parse(getSheetUrl(sheetName), {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: (results) => resolve(results.data || []),
                error: () => resolve([]) // 遇到空表或错误时返回空数组
            });
        });
    }

    // 安全获取字段数据的工具函数（兼容双语表头）
    function getVal(row, keys) {
        if (!row) return "-";
        for (let key of keys) {
            for (let rowKey in row) {
                if (rowKey.trim().toLowerCase() === key.toLowerCase()) {
                    return row[rowKey] || "-";
                }
            }
        }
        return "-";
    }

    // 核心查询函数
    async function searchStudent() {
        const inputId = document.getElementById("studentIdInput").value.trim();
        if (!inputId) {
            alert("请输入运动员学号 ID！");
            return;
        }

        const loadingEl = document.getElementById("loading");
        const emptyEl = document.getElementById("emptyMessage");
        const contentEl = document.getElementById("profileContent");

        loadingEl.classList.remove("hidden");
        emptyEl.classList.add("hidden");
        contentEl.classList.add("hidden");

        try {
            // 并行读取 6 个 Sheet 的数据
            const [profiles, bodyData, testData, trackRaces, fieldRaces, crossRaces] = await Promise.all([
                fetchSheetData("个人基本资料"),
                fetchSheetData("身体数据"),
                fetchSheetData("测试数据"),
                fetchSheetData("比赛成绩 (TRACK)"),
                fetchSheetData("比赛成绩 (FIELD)"),
                fetchSheetData("比赛成绩 (CROSS COUNTRY)")
            ]);

            loadingEl.classList.add("hidden");

            // 1. 匹配个人资料
            const student = profiles.find(item => {
                const id = getVal(item, ["学号 ID", "学号", "ID"]);
                return String(id).trim() === inputId;
            });

            if (!student) {
                emptyEl.innerText = `❌ 未找到学号为【${inputId}】的运动员档案！`;
                emptyEl.classList.remove("hidden");
                return;
            }

            // 2. 渲染个人基本资料
            document.getElementById("infoNameC").innerText = getVal(student, ["姓名 NAME (C)", "姓名", "NAME (C)"]);
            document.getElementById("infoNameE").innerText = getVal(student, ["姓名 NAME(E)", "NAME(E)", "NAME (E)"]);
            document.getElementById("infoId").innerText = getVal(student, ["学号 ID", "学号", "ID"]);
            document.getElementById("infoGender").innerText = getVal(student, ["性别 GENDER", "性别", "GENDER"]);
            document.getElementById("infoIc").innerText = getVal(student, ["身份证号码 IC No.", "身份证号码", "IC No."]);
            document.getElementById("infoDob").innerText = getVal(student, ["出生日期 D.O.B.", "出生日期", "D.O.B."]);
            
            const age = getVal(student, ["年龄 AGE", "年龄"]);
            const trainAge = getVal(student, ["训练年龄 TRAINING AGE", "训练年龄"]);
            document.getElementById("infoAgeGroup").innerText = `${age}岁 / 训练 ${trainAge}`;
            
            document.getElementById("infoContact").innerText = getVal(student, ["联络电话 CONTACT", "联络电话"]);
            document.getElementById("infoEmail").innerText = getVal(student, ["邮箱 EMAIL", "邮箱"]);

            const pEvent = getVal(student, ["主项 PRIMARY", "主项"]);
            const pBest = getVal(student, ["个人最好成绩 PRIMARY BEST PERFORMANCE", "个人最好成绩"]);
            document.getElementById("infoPrimary").innerText = `${pEvent} (${pBest})`;

            const sEvent = getVal(student, ["副项 SECONDARY", "副项"]);
            const sBest = getVal(student, ["个人最好成绩 SECONDARY BEST PERFORMANCE", "个人最好成绩"]);
            document.getElementById("infoSecondary").innerText = `${sEvent} (${sBest})`;

            // 照片设置
            const photoUrl = getVal(student, ["照片 PHOTO", "照片", "PHOTO"]);
            document.getElementById("avatarImg").src = photoUrl !== "-" ? photoUrl : 'https://dummyimage.com/150x190/cccccc/666666.png&text=No+Photo';

            // 3. 渲染 Track 径赛表格
            renderStandardTable("#trackTable tbody", trackRaces, inputId, [
                ["比赛年份 YEAR", "年份", "YEAR"],
                ["比赛名称 TOURNAMENT", "比赛名称"],
                ["比赛项目 EVENT", "比赛项目"],
                ["比赛成绩 RESULTS (hh:mm:ss,ss)", "比赛成绩", "RESULTS"],
                ["备注 REMARKS", "备注"]
            ]);

            // 4. 渲染 Field 田赛表格
            renderStandardTable("#fieldTable tbody", fieldRaces, inputId, [
                ["比赛年份 YEAR", "年份", "YEAR"],
                ["比赛名称 TOURNAMENT", "比赛名称"],
                ["比赛项目 EVENT", "比赛项目"],
                ["比赛成绩 RESULTS (m)", "比赛成绩", "RESULTS"],
                ["备注 REMARKS", "备注"]
            ]);

            // 5. 渲染 Cross Country 越野赛表格
            renderStandardTable("#crossTable tbody", crossRaces, inputId, [
                ["比赛年份 YEAR", "年份", "YEAR"],
                ["比赛名称 TOURNAMENT", "比赛名称"],
                ["比赛项目 EVENT", "比赛项目"],
                ["比赛成绩 RESULTS (hh:mm:ss,ss)", "比赛成绩", "RESULTS"],
                ["备注 REMARKS", "备注"]
            ]);

            // 6. 动态渲染测试数据与身体数据 (保留原 Sheet 里的所有自定义列)
            renderDynamicTable("#testsTable", testData, inputId);
            renderDynamicTable("#bodyTable", bodyData, inputId);

            contentEl.classList.remove("hidden");

        } catch (error) {
            loadingEl.classList.add("hidden");
            emptyEl.innerText = "⚠️ 数据读取异常，请检查 Google Sheet ID 或共享权限设置！";
            emptyEl.classList.remove("hidden");
            console.error(error);
        }
    }

    // 通用渲染固定结构表格
    function renderStandardTable(tbodySelector, dataList, inputId, columnsMap) {
        const tbody = document.querySelector(tbodySelector);
        const filteredData = dataList.filter(item => {
            const id = getVal(item, ["学号 ID", "学号", "ID"]);
            return String(id).trim() === inputId;
        });

        tbody.innerHTML = filteredData.length ? "" : `<tr><td colspan="${columnsMap.length}">暂无相关比赛记录</td></tr>`;
        
        filteredData.forEach(item => {
            let tr = "<tr>";
            columnsMap.forEach(keys => {
                tr += `<td>${getVal(item, keys)}</td>`;
            });
            tr += "</tr>";
            tbody.innerHTML += tr;
        });
    }

    // 通用渲染动态结构表格（适合身体数据、测试数据）
    function renderDynamicTable(tableSelector, dataList, inputId) {
        const table = document.querySelector(tableSelector);
        const thead = table.querySelector("thead");
        const tbody = table.querySelector("tbody");

        const filteredData = dataList.filter(item => {
            const id = getVal(item, ["学号 ID", "学号", "ID"]);
            return String(id).trim() === inputId;
        });

        if (!filteredData.length || !dataList.length) {
            thead.innerHTML = "<tr><th>记录</th></tr>";
            tbody.innerHTML = "<tr><td>暂无相关数据</td></tr>";
            return;
        }

        // 动态提取原Sheet的所有列名 (排除学号ID列)
        const headers = Object.keys(dataList[0]).filter(h => !["学号 id", "学号", "id"].includes(h.trim().toLowerCase()));

        let thHtml = "<tr>";
        headers.forEach(h => thHtml += `<th>${h}</th>`);
        thHtml += "</tr>";
        thead.innerHTML = thHtml;

        let tbodyHtml = "";
        filteredData.forEach(row => {
            tbodyHtml += "<tr>";
            headers.forEach(h => tbodyHtml += `<td>${row[h] || "-"}</td>`);
            tbodyHtml += "</tr>";
        });
        tbody.innerHTML = tbodyHtml;
    }

    // 屏幕 Tabs 切换
    function switchTab(tabName) {
        document.querySelectorAll(".tab-content").forEach(el => el.classList.add("hidden"));
        document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
        
        document.getElementById(`tab-${tabName}`).classList.remove("hidden");
        event.currentTarget.classList.add("active");
    }
</script>

</body>
</html>
