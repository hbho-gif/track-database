<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>循人中学田径队数据库</title>
    <!-- 引入 PapaParse 用于解析 Google Sheet CSV 数据 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f6f9;
            color: #333;
        }
        .container {
            max-width: 960px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        /* 查询控制区 */
        .search-box {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            background: #eef2f7;
            padding: 16px;
            border-radius: 8px;
        }
        .search-box input {
            flex: 1;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }
        .search-box input:focus { border-color: #0056b3; }
        .search-box button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-search { background-color: #1a73e8; color: white; }
        .btn-search:hover { background-color: #1557b0; }
        .btn-print { background-color: #34a853; color: white; }
        .btn-print:hover { background-color: #2d8e47; }

        /* 个人基本资料卡片 */
        .profile-card {
            display: flex;
            gap: 24px;
            border-bottom: 2px solid #eef2f7;
            padding-bottom: 24px;
            margin-bottom: 24px;
        }
        .avatar {
            width: 150px;
            height: 190px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
            background-color: #fafafa;
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px 20px;
            flex: 1;
        }
        .info-item { font-size: 15px; line-height: 1.5; }
        .info-item label { font-weight: bold; color: #555; }
        .full-width { grid-column: span 2; }

        /* 页签 (Tabs) 切换控制 */
        .tabs {
            display: flex;
            gap: 8px;
            border-bottom: 2px solid #eef2f7;
            margin-top: 20px;
            margin-bottom: 15px;
        }
        .tab-btn {
            padding: 10px 16px;
            border: none;
            background: none;
            font-size: 15px;
            font-weight: bold;
            color: #666;
            cursor: pointer;
            border-bottom: 3px solid transparent;
        }
        .tab-btn.active {
            color: #1a73e8;
            border-bottom-color: #1a73e8;
        }

        /* 数据表格组件 */
        section { margin-top: 15px; }
        h3 { color: #1a73e8; border-left: 4px solid #1a73e8; padding-left: 10px; margin-bottom: 12px; margin-top: 0; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #e0e0e0;
            padding: 10px 12px;
            text-align: left;
        }
        th { background-color: #f8f9fa; font-weight: bold; color: #444; }
        tr:nth-child(even) { background-color: #fcfcfc; }

        .hidden { display: none !important; }
        .message { font-size: 16px; color: #666; text-align: center; padding: 50px 0; }

        /* A4 打印适配样式 */
        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; padding: 0; width: 100%; max-width: 100%; }
            .no-print { display: none !important; }
            .tab-content { display: block !important; margin-bottom: 25px; }
            h3 { border-left-color: #000; color: #000; }
            th { background-color: #eeeeee !important; -webkit-print-color-adjust: exact; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2 class="no-print" style="text-align: center; margin-top: 0; color: #1a73e8;">🏃‍♂️ 循人中学田径队数据库</h2>

    <!-- 查询与操作区 -->
   <!-- 搜索区域 -->
    <div class="search-box no-print" style="position: relative; max-width: 400px; margin: 20px auto;">
        <div style="display: flex; gap: 8px;">
            <input type="text" id="searchInput" placeholder="输入学号、中文姓名或英文姓名..." 
               onkeyup="if(event.key==='Enter') searchStudent()"
               style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 15px;">
            <button onclick="searchStudent()" style="padding: 10px 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 15px;">🔍 查询</button>
            <button class="btn-print" onclick="window.print()">🖨️ 打印/保存为 PDF</button>
        </div>
       
        <!-- 用于显示多重模糊匹配结果的下拉选择列表 -->
        <div id="searchResultsList" style="display: none; position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #ccc; border-radius: 0 0 4px 4px; max-height: 200px; overflow-y: auto; z-index: 1000; box-shadow: 0 4px 6px rgba(0,0,0,0.1);"></div>
    </div>

    <div id="loading" class="message hidden">⏳ 正在从云端调取档案，请稍候...</div>
    <div id="emptyMessage" class="message">💡 请在上方输入框输入学号 ID 并点击“查询档案”。</div>

    <!-- 档案主体 -->
    <div id="profileContent" class="hidden">
        
        <!-- 1. 个人基本资料 -->
        <div class="profile-card">
            <img id="avatarImg" class="avatar" src="" alt="运动员照片" onerror="this.src='https://dummyimage.com/150x190/cccccc/666666.png&text=No+Photo'">
            <div class="info-grid">
                <div class="info-item"><label>姓名 (中文)：</label><span id="infoNameC">-</span></div>
                <div class="info-item"><label>姓名 (英文)：</label><span id="infoNameE">-</span></div>
                <div class="info-item"><label>学号 ID：</label><span id="infoId">-</span></div>
                <div class="info-item"><label>性别：</label><span id="infoGender">-</span></div>
                <div class="info-item"><label>身份证 IC：</label><span id="infoIc">-</span></div>
                <div class="info-item"><label>出生日期：</label><span id="infoDob">-</span></div>
                <div class="info-item"><label>年龄 / 训练年龄：</label><span id="infoAgeGroup">-</span></div>
                <div class="info-item"><label>联络电话：</label><span id="infoContact">-</span></div>
                <div class="info-item full-width"><label>主项及最佳成绩：</label><span id="infoPrimary">-</span></div>
                <div class="info-item full-width"><label>副项及最佳成绩：</label><span id="infoSecondary">-</span></div>
                <div class="info-item full-width"><label>邮箱：</label><span id="infoEmail">-</span></div>
            </div>
        </div>

        <!-- 屏幕查看时的分类 Tabs 控制栏 -->
        <div class="tabs no-print">
            <button class="tab-btn active" onclick="switchTab(event, 'track')">🏃 比赛成绩 (TRACK)</button>
            <button class="tab-btn" onclick="switchTab(event, 'field')">🏋️ 比赛成绩 (FIELD)</button>
            <button class="tab-btn" onclick="switchTab(event, 'cross')">🌲 比赛成绩 (CROSS COUNTRY)</button>
            <button class="tab-btn" onclick="switchTab(event, 'tests')">📈 测试数据</button>
            <button class="tab-btn" onclick="switchTab(event, 'body')">📏 身体数据</button>
        </div>

        <!-- 2. 径赛成绩 TRACK -->
        <div id="tab-track" class="tab-content">
            <section>
                <h3>🏃 比赛成绩 (TRACK)</h3>
                <div class="filter-bar no-print" style="margin-bottom: 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
                    <label>📅 年份: 
                        <select id="trackYearFilter" onchange="applyFilterAndSort('track')" style="padding: 6px; border-radius: 4px; border: 1px solid #ccc;">
                            <option value="ALL">全部年份</option>
                        </select>
                    </label>

                    <label>🏃 项目: 
                        <select id="trackEventFilter" onchange="applyFilterAndSort('track')" style="padding: 6px; border-radius: 4px; border: 1px solid #ccc;">
                            <option value="ALL">全部项目</option>
                        </select>
                    </label>

                    <label>📊 成绩排序: 
                        <select id="trackSortOrder" onchange="applyFilterAndSort('track')" style="padding: 6px; border-radius: 4px; border: 1px solid #ccc;">
                            <option value="DEFAULT">默认排序 (原表格顺序)</option>
                            <option value="DESC">成绩从大到小 (慢 -> 快 / 远 -> 近)</option>
                            <option value="ASC">成绩从小到大 (快 -> 慢 / 近 -> 远)</option>
                        </select>
                    </label>
                </div>
                <table id="trackTable">
                    <thead>
                        <tr><th>年份</th><th>比赛名称</th><th>比赛项目</th><th>比赛成绩 (hh:mm:ss,ss)</th><th>备注</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </section>
        </div>

        <!-- 3. 田赛成绩 FIELD -->
        <div id="tab-field" class="tab-content hidden">
            <section>
                <h3>🏋️ 比赛成绩 (FIELD)</h3>
                <div class="filter-bar no-print" style="margin-bottom: 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
                    <label>📅 年份: 
                        <select id="fieldYearFilter" onchange="applyFilterAndSort('field')" style="padding: 6px; border-radius: 4px; border: 1px solid #ccc;">
                            <option value="ALL">全部年份</option>
                        </select>
                    </label>

                    <label>🏋️ 项目: 
                        <select id="fieldEventFilter" onchange="applyFilterAndSort('field')" style="padding: 6px; border-radius: 4px; border: 1px solid #ccc;">
                            <option value="ALL">全部项目</option>
                        </select>
                    </label>

                    <label>📊 成绩排序: 
                        <select id="fieldSortOrder" onchange="applyFilterAndSort('field')" style="padding: 6px; border-radius: 4px; border: 1px solid #ccc;">
                            <option value="DEFAULT">默认排序 (原表格顺序)</option>
                            <option value="DESC">成绩从大到小 (远/高 -> 近/低)</option>
                            <option value="ASC">成绩从小到大 (近/低 -> 远/高)</option>
                        </select>
                    </label>
                </div>
                <table id="fieldTable">
                    <thead>
                        <tr><th>年份</th><th>比赛名称</th><th>比赛项目</th><th>比赛成绩 (m)</th><th>备注</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </section>
        </div>

        <!-- 4. 越野赛成绩 CROSS COUNTRY -->
        <div id="tab-cross" class="tab-content hidden">
            <section>
                <h3>🌲 比赛成绩 (CROSS COUNTRY)</h3>
                <div class="filter-bar no-print" style="margin-bottom: 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
                    <label>📅 年份: 
                        <select id="crossYearFilter" onchange="applyFilterAndSort('cross')" style="padding: 6px; border-radius: 4px; border: 1px solid #ccc;">
                            <option value="ALL">全部年份</option>
                        </select>
                    </label>

                    <label>📏 距离: 
                        <select id="crossDistanceFilter" onchange="applyFilterAndSort('cross')" style="padding: 6px; border-radius: 4px; border: 1px solid #ccc;">
                            <option value="ALL">全部距离</option>
                        </select>
                    </label>

                    <label>📊 成绩排序: 
                        <select id="crossSortOrder" onchange="applyFilterAndSort('cross')" style="padding: 6px; border-radius: 4px; border: 1px solid #ccc;">
                            <option value="DEFAULT">默认排序 (原表格顺序)</option>
                            <option value="DESC">成绩从大到小 (慢 -> 快)</option>
                            <option value="ASC">成绩从小到大 (快 -> 慢)</option>
                        </select>
                    </label>
                </div>
                <table id="crossTable">
                    <thead>
                        <tr><th>年份</th><th>比赛名称</th><th>距离</th><th>比赛成绩 (hh:mm:ss,ss)</th><th>备注</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </section>
        </div>

        <!-- 5. 测试数据 -->
        <div id="tab-tests" class="tab-content hidden">
            <section>
                <h3>📈 测试数据</h3>
                <table id="testsTable">
                    <thead>
                        <tr><th>项目</th><th>第一圈</th><th>第二圈</th><th>第三圈</th><th>第四圈</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </section>
        </div>

        <!-- 6. 身体数据 -->
        <div id="tab-body" class="tab-content hidden">
            <section>
                <h3>📏 身体数据</h3>
                <table id="bodyTable">
                    <thead></thead>
                    <tbody></tbody>
                </table>
            </section>
        </div>

    </div>
</div>

<script>
   // 1. 基础配置与通用工具函数（放在 script 最上方）
   const SHEET_ID = "15iHPj4lwny0eiHs0EXndDeKA3oJgdvnO10aVkWPxukk"; // 替换为你的真实 ID

    function getSheetUrl(sheetName) {
        return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
}

    function fetchSheetData(sheetName) {
        return new Promise((resolve) => {
            Papa.parse(getSheetUrl(sheetName), {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: (results) => resolve(results.data || []),
                error: () => resolve([])
            });
        });
    }

    // 2. 全局变量声明
    let basicStudents = [];
    let trackRaces = [];
    let fieldRaces = [];
    let crossRaces = [];
    let testData = [];

    // 3. 执行数据批量加载（必须放在 getSheetUrl 和 fetchSheetData 的下方）
    Promise.all([
        fetchSheetData("Basic"),           // 请确保这里的 Tab 名称与 Google Sheet 底部的完全一致
        fetchSheetData("TRACK"),
        fetchSheetData("FIELD"),
        fetchSheetData("CROSS COUNTRY"),
        fetchSheetData("Test")
    ]).then(([basic, track, field, cross, test]) => {
        basicStudents = basic;
        trackRaces = track;
        fieldRaces = field;
        crossRaces = cross;
        testData = test;

        console.log("所有数据加载完成！基本资料笔数:", basicStudents.length);
    }).catch(err => {
        console.error("数据读取失败:", err);
    });
    
       
    // 模糊匹配字段工具，模糊搜索包含某个关键词的列
    function getVal(row, keys) {
        if (!row) return "-";
        for (let key of keys) {
            for (let rowKey in row) {
                if (rowKey.trim().toLowerCase().includes(key.toLowerCase())) {
                    return row[rowKey] || "-";
                }
            }
        }
        return "-";
    }

    // 💡 将各种时间/成绩字符串统一解析为总秒数/数值，用于准确排序
    function parsePerformanceToSeconds(val) {
        if (!val || val === "-" || val === "") return -1;
        let str = String(val).trim().replace(/：/g, ":");

        // 如果是时间格式 (hh:mm:ss.ss 或 mm:ss.ss)
        if (str.includes(":")) {
            let parts = str.split(":");
            if (parts.length === 2) {
                let mm = parseFloat(parts[0]) || 0;
                let ss = parseFloat(parts[1]) || 0;
                return mm * 60 + ss;
            } else if (parts.length === 3) {
                let hh = parseFloat(parts[0]) || 0;
                let mm = parseFloat(parts[1]) || 0;
                let ss = parseFloat(parts[2]) || 0;
                return hh * 3600 + mm * 60 + ss;
            }
        }

        // 如果是纯数值 (如径赛秒数 12.34 或田赛距离 5.45)
        let num = parseFloat(str);
        return isNaN(num) ? -1 : num;
    }

    // 全局数据缓存对象
    let raceDataStore = {
        inputId: "",
        track: [],
        field: [],
        cross: []
    };

    // 模块配置映射表
    const moduleConfig = {
        track: {
            tableSelector: "#trackTable tbody",
            yearFilterId: "trackYearFilter",
            eventFilterId: "trackEventFilter",
            sortOrderId: "trackSortOrder",
            isTimeFormat: true,
            columnsMap: [
                ["year", "年份"],
                ["tournament", "比赛名称"],
                ["event", "比赛项目"],
                ["results", "成绩"],
                ["remarks", "备注"]
            ]
        },
        field: {
            tableSelector: "#fieldTable tbody",
            yearFilterId: "fieldYearFilter",
            eventFilterId: "fieldEventFilter",
            sortOrderId: "fieldSortOrder",
            isTimeFormat: false, // 田赛（高度/距离）不需要时间格式补全
            columnsMap: [
                ["year", "年份"],
                ["tournament", "比赛名称"],
                ["event", "比赛项目"],
                ["results", "m", "成绩"],
                ["remarks", "备注"]
            ]
        },
        cross: {
            tableSelector: "#crossTable tbody",
            yearFilterId: "crossYearFilter",
            eventFilterId: "crossDistanceFilter",
            sortOrderId: "crossSortOrder",
            isTimeFormat: true, // 越野赛需要时间格式转换
            columnsMap: [
                ["year", "年份"],
                ["tournament", "比赛名称"],
                ["distance", "距离"],
                ["results", "成绩"],
                ["remarks", "备注"]
            ]
        }
    };

    // 💡 动态初始化下拉菜单选项（修正版：全面兼容田赛/径赛/越野赛的字段读取）
    function initModuleFilterOptions(type, dataList) {
        const config = moduleConfig[type];
        if (!config) return;

        const yearSelect = document.getElementById(config.yearFilterId);
        const eventSelect = document.getElementById(config.eventFilterId);

        if (!yearSelect || !eventSelect) return;

        const years = new Set();
        const events = new Set();

        dataList.forEach(item => {
            // 1. 读取年份（兼容 year, 年份）
            const year = getVal(item, ["year", "年份"]);
            if (year && year !== "-") years.add(String(year).trim());

            // 2. 读取项目/距离（根据模块优先使用对应字段，防止错读）
            let eventVal = "-";
            if (type === "cross") {
                eventVal = getVal(item, ["distance", "distance/km", "距离", "event", "比赛项目"]);
            } else if (type === "field") {
                eventVal = getVal(item, ["event", "比赛项目", "项目", "fieldEvent"]);
            } else {
                eventVal = getVal(item, ["event", "比赛项目", "项目"]);
            }

            if (eventVal && eventVal !== "-") {
                events.add(String(eventVal).trim());
            }
        });

        // 填充年份下拉框
        yearSelect.innerHTML = '<option value="ALL">全部年份</option>';
        Array.from(years).sort().reverse().forEach(y => {
            yearSelect.innerHTML += `<option value="${y}">${y}年</option>`;
        });

        // 填充项目/距离下拉框
        const defaultText = (type === "cross") ? "全部距离" : "全部项目";
        eventSelect.innerHTML = `<option value="ALL">${defaultText}</option>`;
        
        Array.from(events).sort().forEach(e => {
            eventSelect.innerHTML += `<option value="${e}">${e}</option>`;
        });
    }

    // 💡 执行通用筛选与排序（增强版容错匹配）
    function applyFilterAndSort(type) {
        const config = moduleConfig[type];
        if (!config) return;

        const rawData = raceDataStore[type];
        if (!rawData) return;

        const yearSelect = document.getElementById(config.yearFilterId);
        const eventSelect = document.getElementById(config.eventFilterId);
        const sortSelect = document.getElementById(config.sortOrderId);

        // 防错处理：若无下拉菜单直接渲染
        if (!yearSelect || !eventSelect || !sortSelect) {
            const defaultFiltered = rawData.filter(item => {
                const id = getVal(item, ["学号", "id"]);
                return String(id).trim() === String(raceDataStore.inputId).trim();
            });
            renderStandardTableDirect(config.tableSelector, defaultFiltered, config.columnsMap, config.isTimeFormat);
            return;
        }

        const selectedYear = String(yearSelect.value).trim();
        const selectedEvent = String(eventSelect.value).trim();
        const sortOrder = sortSelect.value;

        // 1. 筛选逻辑（强化类型转换与去除空白）
        let filtered = rawData.filter(item => {
            const id = String(getVal(item, ["学号", "id"])).trim();
            const matchesId = (id === String(raceDataStore.inputId).trim());

            const year = String(getVal(item, ["year", "年份"])).trim();
            const event = String(getVal(item, ["event", "比赛项目"])).trim();

            const matchesYear = (selectedYear === "ALL" || year === selectedYear);
            const matchesEvent = (selectedEvent === "ALL" || event === selectedEvent);

            return matchesId && matchesYear && matchesEvent;
        });

        // 2. 排序逻辑
        if (sortOrder === "DESC") {
            filtered.sort((a, b) => {
                let valA = parsePerformanceToSeconds(getVal(a, ["results", "m", "成绩"]));
                let valB = parsePerformanceToSeconds(getVal(b, ["results", "m", "成绩"]));
                return valB - valA;
            });
        } else if (sortOrder === "ASC") {
            filtered.sort((a, b) => {
                let valA = parsePerformanceToSeconds(getVal(a, ["results", "m", "成绩"]));
                let valB = parsePerformanceToSeconds(getVal(b, ["results", "m", "成绩"]));
                return valA - valB;
            });
        }

        // 3. 渲染
        renderStandardTableDirect(config.tableSelector, filtered, config.columnsMap, config.isTimeFormat);
    }

    // 💡 统一渲染表格函数（支持比赛成绩与多圈测试成绩格式化）
    function renderStandardTableDirect(tbodySelector, filteredData, columnsMap, isTimeFormat = false) {
        const tbody = document.querySelector(tbodySelector);
        if (!tbody) return;

        tbody.innerHTML = filteredData.length ? "" : `<tr><td colspan="${columnsMap.length}">暂无符合条件的记录</td></tr>`;
        
        filteredData.forEach(item => {
            let tr = "<tr>";
            columnsMap.forEach(keys => {
                let value = getVal(item, keys);
                
                // 检查是否为成绩/秒数/分段圈数列（匹配 "results"、"成绩"、"圈" 等关键字）
                const isResultColumn = keys.some(k => {
                    const kLower = k.toLowerCase();
                    return kLower === "results" || kLower === "成绩" || kLower.includes("圈") || kLower.includes("time");
                });

                // 开启时间转换时，自动处理匹配到的列
                if (isTimeFormat && isResultColumn) {
                    value = formatTime(value);
                }

                tr += `<td>${value}</td>`;
            });
            tr += "</tr>";
            tbody.innerHTML += tr;
        });
    }
    
    // ⏱️ 增强版时间自动补齐与格式化函数
    function formatTime(val) {
        // 1. 过滤空值、无效值
        if (val === undefined || val === null) return "-";
        
        let str = String(val).trim();
        // 清理 Google Sheet 可能带入的不可见控制字符或中文冒号
        str = str.replace(/：/g, ":").replace(/[\u200B-\u200D\uFEFF]/g, "");
        
        if (str === "" || str === "-") return "-";

        // 2. 如果包含冒号 (mm:ss.ss 或 hh:mm:ss.ss)
        if (str.includes(":")) {
            let parts = str.split(":");
            
            // 格式: mm:ss.ss (例如 01:23.45 或 1:23.45)
            if (parts.length === 2) {
                let mm = parts[0].trim().padStart(2, '0');
                let ssPart = parts[1].trim();
                
                // 处理秒数部分，确保补齐两位小数
                let secNum = parseFloat(ssPart);
                let ss = isNaN(secNum) ? ssPart : secNum.toFixed(2).padStart(5, '0');
                
                return `00:${mm}:${ss}`;
            }

            // 格式: hh:mm:ss.ss (例如 01:02:03.45)
            if (parts.length === 3) {
                let hh = parts[0].trim().padStart(2, '0');
                let mm = parts[1].trim().padStart(2, '0');
                let ssPart = parts[2].trim();
                
                let secNum = parseFloat(ssPart);
                let ss = isNaN(secNum) ? ssPart : secNum.toFixed(2).padStart(5, '0');
                
                return `${hh}:${mm}:${ss}`;
            }
        }

        // 3. 如果是纯数字/纯秒数 (例如 12.34 或 85.2)
        let totalSeconds = parseFloat(str);
        if (!isNaN(totalSeconds)) {
            let hours = Math.floor(totalSeconds / 3600);
            let minutes = Math.floor((totalSeconds % 3600) / 60);
            let seconds = (totalSeconds % 60).toFixed(2);

            let hh = String(hours).padStart(2, '0');
            let mm = String(minutes).padStart(2, '0');
            let ss = String(parseFloat(seconds).toFixed(2)).padStart(5, '0');

            return `${hh}:${mm}:${ss}`;
        }

        // 4. 如果是文字或其他格式，原样输出，不强制显示 "-"
        return str;
    }
    
    // 💡 智能匹配算法（不区分大小写、忽略空格、支持子字符串模糊包含）
    function isMatchStudent(student, query) {
        if (!query) return false;
        
        const q = String(query).trim().toLowerCase().replace(/\s+/g, "");

        // 提取学号、中文姓名、英文姓名
        const id = String(getVal(student, ["学号", "id"])).toLowerCase().replace(/\s+/g, "");
        const nameC = String(getVal(student, ["中文姓名", "姓名", "nameC", "name_cn"])).toLowerCase().replace(/\s+/g, "");
        const nameE = String(getVal(student, ["英文姓名", "nameE", "name_en"])).toLowerCase().replace(/\s+/g, "");

        // 只要学号、中文名或英文名包含关键字，即判定匹配成功
        return (id.includes(q) || nameC.includes(q) || nameE.includes(q));
    }

    // 💡 核心查询入口（支持单人定位与多人匹配弹窗）
    function searchStudent(explicitId = null) {
        // 关闭以前的模糊搜索结果下拉框
        const resultsContainer = document.getElementById("searchResultsList");
        if (resultsContainer) resultsContainer.style.display = "none";

        // 如果是通过点击结果列表传入的精确 ID
        if (explicitId) {
            executeStudentRender(String(explicitId).trim());
            return;
        }

        const inputVal = document.getElementById("searchInput").value.trim();
        if (!inputVal) {
            alert("请输入学号或姓名进行查询！");
            return;
        }

        // 在基本资料库中寻找所有符合条件的学生
        const matchedStudents = basicStudents.filter(s => isMatchStudent(s, inputVal));

        if (matchedStudents.length === 0) {
            alert("未找到符合条件的运动员信息，请核对后重试！");
        } else if (matchedStudents.length === 1) {
            // 唯一匹配：直接渲染该运动员数据
            const targetId = String(getVal(matchedStudents[0], ["学号", "id"])).trim();
            executeStudentRender(targetId);
        } else {
            // 多个匹配：展示匹配列表让用户自行点击选择
            showMatchedStudentsList(matchedStudents);
        }
    }

    // 💡 弹出多人匹配的选择列表
    function showMatchedStudentsList(students) {
        const container = document.getElementById("searchResultsList");
        if (!container) return;

        container.innerHTML = "";
        students.forEach(s => {
            const id = getVal(s, ["学号", "id"]);
            const nameC = getVal(s, ["中文姓名", "姓名", "nameC"]);
            const nameE = getVal(s, ["英文姓名", "nameE"]);

            const item = document.createElement("div");
            item.style.cssText = "padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; text-align: left;";
            item.innerHTML = `<strong>${nameC}</strong> (${nameE}) - <span style="color: #666;">学号: ${id}</span>`;
            
            // 鼠标悬停高亮效果
            item.onmouseover = () => item.style.backgroundColor = "#f0f7ff";
            item.onmouseout = () => item.style.backgroundColor = "white";

            // 点击具体某位学生直接加载
            item.onclick = () => {
                document.getElementById("searchInput").value = id;
                executeStudentRender(String(id).trim());
                container.style.display = "none";
            };

            container.appendChild(item);
        });

        container.style.display = "block";
    }

    // 💡 统一渲染逻辑（带有 DOM 安全校验防错）
    function executeStudentRender(inputId) {
        // 查找学生个人信息
        const basicDataList = basicStudents.length ? basicStudents : (raceDataStore.basic || []);
        const student = basicDataList.find(i => String(getVal(i, ["学号", "id"])).trim() === inputId);
        
        if (!student) {
            alert("未找到该学号的详细资料！");
            return;
        }

        // 辅助赋值安全函数，找不到节点时不报错
        const setSafeText = (id, value) => {
            const elem = document.getElementById(id);
            if (elem) elem.textContent = value;
        };

        // 1. 安全填入个人基本资料（兼容 infoNameC 与 nameC 等常见命名）
        const nameC = getVal(student, ["中文姓名", "姓名", "nameC", "name_cn"]);
        const nameE = getVal(student, ["英文姓名", "nameE", "name_en"]);
        const sClass = getVal(student, ["班级", "class"]);
        const gender = getVal(student, ["性别", "gender"]);

        setSafeText("infoNameC", nameC);
        setSafeText("nameC", nameC);

        setSafeText("infoNameE", nameE);
        setSafeText("nameE", nameE);

        setSafeText("infoId", inputId);
        setSafeText("studentId", inputId);

        setSafeText("infoClass", sClass);
        setSafeText("studentClass", sClass);

        setSafeText("infoGender", gender);
        setSafeText("studentGender", gender);

        // 照片安全替换
        const photoUrl = getVal(student, ["photo", "照片", "avatar"]);
        const avatarElem = document.getElementById("avatarImg") || document.getElementById("studentPhoto");
        if (avatarElem) {
            avatarElem.src = (photoUrl !== "-" && photoUrl.startsWith("http")) 
                ? photoUrl 
                : 'https://dummyimage.com/150x190/cccccc/666666.png&text=No+Photo';
        }

        // 2. 缓存全局数据
        raceDataStore.inputId = inputId;
        raceDataStore.track = trackRaces;
        raceDataStore.field = fieldRaces;
        raceDataStore.cross = crossRaces;

        // 3. 渲染 TRACK 径赛
        const studentTrack = trackRaces.filter(i => String(getVal(i, ["学号", "id"])).trim() === inputId);
        initModuleFilterOptions("track", studentTrack);
        applyFilterAndSort("track");

        // 4. 渲染 FIELD 田赛
        const studentField = fieldRaces.filter(i => String(getVal(i, ["学号", "id"])).trim() === inputId);
        initModuleFilterOptions("field", studentField);
        applyFilterAndSort("field");

        // 5. 渲染 CROSS COUNTRY 越野赛
        const studentCross = crossRaces.filter(i => String(getVal(i, ["学号", "id"])).trim() === inputId);
        initModuleFilterOptions("cross", studentCross);
        applyFilterAndSort("cross");

        // 6. 渲染 TESTS 测试数据
        const studentTest = testData.filter(i => String(getVal(i, ["学号", "id"])).trim() === inputId);
        renderStandardTableDirect("#testsTable tbody", studentTest, [
            ["event", "项目"],
            ["第一圈"],
            ["第二圈"],
            ["第三圈"],
            ["第四圈"]
        ], true);
    }

    function renderDynamicTable(tableSelector, dataList, inputId) {
        const table = document.querySelector(tableSelector);
        const thead = table.querySelector("thead");
        const tbody = table.querySelector("tbody");

        const filteredData = dataList.filter(item => {
            const id = getVal(item, ["学号", "id"]);
            return String(id).trim() === inputId;
        });

        if (!filteredData.length || !dataList.length) {
            thead.innerHTML = "<tr><th>数据</th></tr>";
            tbody.innerHTML = "<tr><td>暂无相关数据</td></tr>";
            return;
        }

        // 提取并过滤掉属于个人资料的列，只保留该Sheet独有列
        const headers = Object.keys(dataList[0]).filter(h => {
            const low = h.trim().toLowerCase();
            return !["学号", "id", "姓名", "name", "ic no", "d.o.b", "photo"].some(ignore => low.includes(ignore));
        });

        let thHtml = "<tr>";
        headers.forEach(h => thHtml += `<th>${h}</th>`);
        thHtml += "</tr>";
        thead.innerHTML = thHtml;

        let tbodyHtml = "";
        filteredData.forEach(row => {
            tbodyHtml += "<tr>";
            headers.forEach(h => tbodyHtml += `<td>${row[h] || "-"}</td>`);
            tbodyHtml += "</tr>";
        });
        tbody.innerHTML = tbodyHtml;
    }

    function switchTab(event, tabName) {
        document.querySelectorAll(".tab-content").forEach(el => el.classList.add("hidden"));
        document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
        
        document.getElementById(`tab-${tabName}`).classList.remove("hidden");
        event.currentTarget.classList.add("active");
    }


    
</script>
